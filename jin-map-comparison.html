<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西晉年度州郡圖</title>
<script>
(() => {
  const source=new URL(window.location.href),target=new URL('index.html',source);
  const year=Number(source.searchParams.get('year'));
  target.searchParams.set('year',String(Number.isInteger(year)&&year>=266&&year<=316?year:304));
  if(source.searchParams.get('jinview')==='boundaries')target.searchParams.set('jinview','boundaries');
  window.location.replace(target.href);
})();
</script>
</head>
<body><p><a href="index.html">前往西晉年度州郡圖</a></p></body>
</html>
