<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>漢魏六朝年末州郡縣表</title>
  <meta name="description" content="依據《中國行政區劃通史》逐年重建漢魏六朝年末州郡縣，並附封國資料。">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="metal">
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">中國歷史行政區劃 · 年度重建</p>
      <h1 id="pageTitle">西晉年末州郡縣表</h1>
      <p id="pageSubtitle" class="subtitle">選擇公元年份，按州查看該年年末的郡國與所轄縣級政區。</p>
    </div>
  </header>

  <main>
    <section class="control-panel" aria-label="查詢條件">
      <div class="control-grid">
        <label>
          <span>朝代</span>
          <select id="dynastySelect" aria-label="選擇朝代">
            <option value="western-han" disabled>西漢（待建）</option>
            <option value="eastern-han" disabled>東漢（待建）</option>
            <option value="cao-wei" disabled>曹魏（待建）</option>
            <option value="western-jin" selected>西晉</option>
            <option value="eastern-jin" disabled>東晉（待建）</option>
            <option value="liu-song" disabled>劉宋（待建）</option>
            <option value="southern-qi" disabled>蕭齊（待建）</option>
            <option value="southern-liang" disabled>蕭梁（待建）</option>
            <option value="chen">南陳</option>
          </select>
        </label>
        <label>
          <span>年份</span>
          <select id="yearSelect" aria-label="選擇公元年份"></select>
        </label>
        <label>
          <span>州</span>
          <select id="stateSelect" aria-label="篩選州"><option value="">全部州</option></select>
        </label>
        <label class="search-label">
          <span>檢索政區或封爵</span>
          <input id="searchInput" type="search" placeholder="例如：南康、始興、建康" autocomplete="off">
        </label>
        <label class="check-label">
          <input id="changedOnly" type="checkbox">
          <span>只看本年有變動者</span>
        </label>
      </div>
      <div class="legend" aria-label="圖例">
        <span><i class="legend-normal">郡縣</i> 宋體類字體</span>
        <span><i class="legend-kingdom">封國</i> 楷體類字體</span>
        <span><i class="legend-change">本年變動</i> 紅色</span>
        <span><i class="legend-uncertain">※</i> 年代或辨字存疑</span>
        <span><i class="legend-citation">[1]</i> 點擊查看依據</span>
        <span id="fiefLegend"><i class="legend-ruler">某王之二年</i> 國主年次</span>
        <span id="qiaoLegend" hidden><i class="legend-qiao">僑郡／僑縣</i> 下劃線</span>
      </div>
    </section>

    <section class="notice" id="statusNotice"><strong>資料狀態：</strong> <span id="statusText"></span></section>

    <section class="summary" aria-live="polite">
      <div><strong id="stateCount">0</strong><span>州</span></div>
      <div><strong id="prefCount">0</strong><span>郡國</span></div>
      <div><strong id="countyCount">0</strong><span>縣級政區</span></div>
      <div><strong id="changeCount">0</strong><span>本年變動項</span></div>
    </section>

    <section id="changePanel" class="change-panel" hidden>
      <h2>本年變動索引</h2>
      <div id="changeList"></div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <section class="method-note">
      <h2>資料與方法</h2>
      <div id="methodContent"></div>
    </section>
  </main>

  <footer><p id="footerText"></p></footer>

  <div id="sourceModal" class="source-modal" hidden>
    <div class="source-modal-backdrop" data-close-modal></div>
    <section class="source-modal-panel" role="dialog" aria-modal="true" aria-labelledby="sourceModalTitle">
      <button id="sourceModalClose" class="source-modal-close" type="button" aria-label="關閉">×</button>
      <h2 id="sourceModalTitle">變動依據</h2>
      <p id="sourceModalSummary" class="source-modal-summary"></p>
      <div id="sourceModalBody"></div>
    </section>
  </div>

  <script src="data/jin-data.js"></script>
  <script src="data/princes.js"></script>
  <script src="data/five-rank-fiefs.js"></script>
  <script src="data/chen-data.js"></script>
  <script src="data/chen-fiefs.js"></script>
  <script src="app.js"></script>
</body>
</html>
